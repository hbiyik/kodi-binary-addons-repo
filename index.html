<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kodi Linux Binary Addons</title>
    <style>
      :root {
        color-scheme: dark;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        background-color: #0b1120;
        color: #e2e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 14px;
        line-height: 1.5;
      }
      body > div {
        max-width: 820px;
        margin: 0 auto;
        background-color: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      }
      body > div > div {
        padding: 0;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead th {
        text-align: left;
        padding: 0.9rem 1.25rem;
        background-color: #131c31;
        color: #f8fafc;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        border-bottom: 1px solid #1e293b;
      }
      tbody td {
        padding: 0.65rem 1.25rem;
        border-bottom: 1px solid rgba(30, 41, 59, 0.7);
        white-space: nowrap;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:nth-child(even) {
        background-color: rgba(15, 23, 42, 0.6);
      }
      tbody tr:hover {
        background-color: #16223b;
      }
      a {
        color: #38bdf8;
        text-decoration: none;
        display: inline-block;
      }
      a:hover {
        color: #7dd3fc;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div>
      <div>
        <table>
          <thead>
            <tr>
              <th>Select Renderer and target Linux cpu architecture</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><a href="repos/repository.binaryaddons-gl-amd64.zip" title="repos/repository.binaryaddons-gl-amd64.zip">repos/repository.binaryaddons-gl-amd64.zip</a></td>
            </tr>
            <tr>
              <td><a href="repos/repository.binaryaddons-gles-amd64.zip" title="repos/repository.binaryaddons-gles-amd64.zip">repos/repository.binaryaddons-gles-amd64.zip</a></td>
            </tr>
            <tr>
              <td><a href="repos/repository.binaryaddons-gl-aarch64.zip" title="repos/repository.binaryaddons-gl-aarch64.zip">repos/repository.binaryaddons-gl-aarch64.zip</a></td>
            </tr>
            <tr>
              <td><a href="repos/repository.binaryaddons-gles-aarch64.zip" title="repos/repository.binaryaddons-gles-aarch64.zip">repos/repository.binaryaddons-gles-aarch64.zip</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
