name: Build Omega Addons (amd64)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  build-omega-amd64:
    permissions:
      contents: write
    uses: ./.github/workflows/build-kodi-addons.yml
    with:
      config_path: configs/Omega.json
      runner: ubuntu-latest